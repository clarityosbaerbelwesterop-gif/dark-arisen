name: Recover Moran Route Content

on:
  push:
    branches: [work/alpha-content-production]
    paths: [.github/workflows/recover-moran-route.yml]

permissions:
  contents: write

jobs:
  apply-moran-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated Moran route tranche
        shell: bash
        run: |
          set -euo pipefail
          cat .github/recovery/moran.part1 .github/recovery/moran.part2 .github/recovery/moran.part3 | base64 -d | gunzip > /tmp/moran.patch
          echo '527599cf420e03154213d0de76b8a9555b6802248df546dd8e7cf4d59daea77e  /tmp/moran.patch' | sha256sum -c -
          git apply --index /tmp/moran.patch
          git rm -f .github/recovery/moran.part1 .github/recovery/moran.part2 .github/recovery/moran.part3 .github/workflows/recover-moran-route.yml
          git config user.name 'ChatGPT Work'
          git config user.email 'chatgpt-work@users.noreply.github.com'
          git commit -m 'feat(moran): extend physical opening route'
          git push origin HEAD:work/alpha-content-production
