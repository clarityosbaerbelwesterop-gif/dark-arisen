name: M0-M2 CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dark-arisen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: UE 5.5 compile, tests, and design laws
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, ue5.5, dark-arisen]
    timeout-minutes: 120
    steps:
      - name: Check out source and LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Verify private Windows UE 5.5 runner
        shell: pwsh
        run: ./Tools/ci/verify-runner.ps1

      - name: Validate M0 repository contract
        shell: pwsh
        run: python Tools/ci/validate_m0.py

      - name: Validate M1 core-loop contract
        shell: pwsh
        run: python Tools/ci/validate_m1.py

      - name: Validate M2 markerless quest foundation
        shell: pwsh
        run: python Tools/ci/validate_m2.py

      - name: Audit design-law prohibitions
        shell: pwsh
        run: python Tools/ci/design_law_audit.py

      - name: Regression-test repository validators
        shell: pwsh
        run: python -m unittest discover -s Tools/ci -p "test_*.py"

      - name: Compile Development and Shipping
        if: github.event_name == 'push'
        shell: pwsh
        run: ./Tools/ci/build-unreal.ps1

      - name: Compile and run Unreal automation tests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./Tools/ci/build-unreal.ps1 -RunAutomationTests
