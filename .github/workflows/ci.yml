name: M0-M8 Native C++ CI

on:
  push:
    branches: [develop, main, work/alpha-content-production, work/final-alpha-opening-runtime]
  pull_request:
    branches: [develop, main, work/final-alpha-opening-runtime]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dark-arisen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static:
    name: Static Alpha contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate canonical Alpha runtime graph
        run: python3 Tools/validation/validate_alpha_runtime.py
      - name: Validate authored story content
        run: python3 Tools/validation/validate_story_content.py
      - name: Compile Python production tools
        run: python3 -m compileall -q Tools
      - name: Report visual release readiness
        run: python3 Tools/validation/validate_visual_release.py
      - name: Reject whitespace errors
        run: git diff --check HEAD^

  verify-engine-neutral:
    # Runs on GitHub-hosted runners: the gameplay core and O3DE tooling need no engine.
    name: Engine-neutral core and O3DE tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and test the engine-neutral core
        run: |
          cmake -S Core -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core --config Release
          ctest --test-dir build/core -C Release --output-on-failure
      - name: Build and test the O3DE operations tool
        run: |
          cmake -S Tools/o3de -B build/ops -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ops --config Release
          ctest --test-dir build/ops -C Release --output-on-failure
      - name: Verify the O3DE pin still matches the official tag
        run: |
          tool=build/ops/DarkArisenO3DE
          if [ -f build/ops/Release/DarkArisenO3DE.exe ]; then tool=build/ops/Release/DarkArisenO3DE.exe; fi
          pinned=$("$tool" lock | sed -n 's/^commit=//p')
          tag=$("$tool" lock | sed -n 's/^tag=//p')
          upstream=$(git ls-remote https://github.com/o3de/o3de.git "refs/tags/$tag" | cut -f1)
          echo "pinned=$pinned upstream=$upstream"
          test -n "$pinned" && test "$pinned" = "$upstream"

  verify-o3de-framework:
    # Builds AzCore from the pinned O3DE sources (no O3DE package server) and runs the
    # Dark Arisen campaign adapter inside a real AZ::ComponentApplication.
    name: O3DE 2605.0 AzCore runtime probe (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify-engine-neutral
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q clang ninja-build libzstd-dev zlib1g-dev libunwind-dev
      - name: Build the operations tool
        run: |
          cmake -S Tools/o3de -B build/ops -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ops
      - name: Check out the pinned O3DE engine sources
        run: |
          commit=$(build/ops/DarkArisenO3DE lock | sed -n 's/^commit=//p')
          git init -q "$RUNNER_TEMP/o3de"
          git -C "$RUNNER_TEMP/o3de" remote add origin https://github.com/o3de/o3de.git
          GIT_LFS_SKIP_SMUDGE=1 git -C "$RUNNER_TEMP/o3de" fetch -q --depth 1 origin "$commit"
          GIT_LFS_SKIP_SMUDGE=1 git -C "$RUNNER_TEMP/o3de" checkout -q --detach "$commit"
      - name: Build AzCore and run the campaign probe
        run: build/ops/DarkArisenO3DE probe --engine="$RUNNER_TEMP/o3de" --build-dir="$RUNNER_TEMP/build"

  verify-windows:
    name: Windows UE 5.8 materialise, compile, tests, laws
    # Job conditions are evaluated before runner env exists. Keep UE verification mandatory.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: verify-static
    runs-on: [self-hosted, Windows, X64, ue5.8, dark-arisen]
    timeout-minutes: 120
    steps:
      - name: Check out source and LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: cmd
        run: call "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" DarkArisenOps Win64 Development "-Project=%GITHUB_WORKSPACE%\DarkArisen.uproject" -WaitMutex -WarningsAsErrors

      - name: Verify private Windows UE 5.8 runner
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" runner-check "--root=%GITHUB_WORKSPACE%" "--engine=%UE_ROOT%"'

      - name: Validate repository contract in native C++
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" validate "--root=%GITHUB_WORKSPACE%"'

      - name: Compile Editor, materialise Alpha content, validate, build game, run automation
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" build "--root=%GITHUB_WORKSPACE%" "--engine=%UE_ROOT%" --automation'

      - name: Package exact Win64 Shipping candidate
        if: github.event_name == 'push'
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" package-alpha "--root=%GITHUB_WORKSPACE%" "--engine=%UE_ROOT%" "--revision=%GITHUB_SHA%"'

  verify-linux:
    name: Linux UE 5.8 materialise, compile, tests, laws
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: verify-static
    runs-on: [self-hosted, Linux, X64, ue5.8, dark-arisen]
    timeout-minutes: 120
    steps:
      - name: Check out source and LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: bash
        run: '"$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh" DarkArisenOps Linux Development "-Project=$GITHUB_WORKSPACE/DarkArisen.uproject" -WaitMutex -WarningsAsErrors'

      - name: Verify private Linux UE 5.8 runner
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" runner-check "--root=$GITHUB_WORKSPACE" "--engine=$UE_ROOT"'

      - name: Validate repository contract in native C++
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" validate "--root=$GITHUB_WORKSPACE"'

      - name: Compile Editor, materialise Alpha content, validate, build game, run automation
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" build "--root=$GITHUB_WORKSPACE" "--engine=$UE_ROOT" --automation'

      - name: Package exact Linux Shipping candidate
        if: github.event_name == 'push'
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" package-alpha "--root=$GITHUB_WORKSPACE" "--engine=$UE_ROOT" "--revision=$GITHUB_SHA"'
