name: M0-M8 Native C++ CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, work/final-alpha-opening-runtime]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dark-arisen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Windows UE 5.8 materialise, compile, tests, laws
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, ue5.8, dark-arisen]
    timeout-minutes: 120
    steps:
      - name: Check out source and LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: cmd
        run: call "%UE_ROOT%\Engine\Build\BatchFiles\Build.bat" DarkArisenOps Win64 Development "-Project=%GITHUB_WORKSPACE%\DarkArisen.uproject" -WaitMutex -WarningsAsErrors

      - name: Verify private Windows UE 5.8 runner
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" runner-check "--root=%GITHUB_WORKSPACE%" "--engine=%UE_ROOT%"'

      - name: Validate repository contract in native C++
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" validate "--root=%GITHUB_WORKSPACE%"'

      - name: Compile Editor, materialise Alpha content, validate, build game, run automation
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" build "--root=%GITHUB_WORKSPACE%" "--engine=%UE_ROOT%" --automation'

      - name: Package exact Win64 Shipping candidate
        if: github.event_name == 'push'
        shell: cmd
        run: '"%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" package-alpha "--root=%GITHUB_WORKSPACE%" "--engine=%UE_ROOT%" "--revision=%GITHUB_SHA%"'

  verify-linux:
    name: Linux UE 5.8 materialise, compile, tests, laws
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ue5.8, dark-arisen]
    timeout-minutes: 120
    steps:
      - name: Check out source and LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: bash
        run: '"$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh" DarkArisenOps Linux Development "-Project=$GITHUB_WORKSPACE/DarkArisen.uproject" -WaitMutex -WarningsAsErrors'

      - name: Verify private Linux UE 5.8 runner
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" runner-check "--root=$GITHUB_WORKSPACE" "--engine=$UE_ROOT"'

      - name: Validate repository contract in native C++
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" validate "--root=$GITHUB_WORKSPACE"'

      - name: Compile Editor, materialise Alpha content, validate, build game, run automation
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" build "--root=$GITHUB_WORKSPACE" "--engine=$UE_ROOT" --automation'

      - name: Package exact Linux Shipping candidate
        if: github.event_name == 'push'
        shell: bash
        run: '"$GITHUB_WORKSPACE/Binaries/Linux/DarkArisenOps" package-alpha "--root=$GITHUB_WORKSPACE" "--engine=$UE_ROOT" "--revision=$GITHUB_SHA"'
