name: M0-M8 Native C++ CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dark-arisen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Windows UE 5.5 native C++ compile, tests, laws
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, ue5.5, dark-arisen]
    timeout-minutes: 120
    steps:
      - name: Check out source and LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: pwsh
        run: |
          & "$env:UE55_ROOT\Engine\Build\BatchFiles\Build.bat" DarkArisenOps Win64 Development "-Project=$PWD\DarkArisen.uproject" -WaitMutex -WarningsAsErrors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate runner and repository contract in C++
        shell: pwsh
        run: |
          $Ops = "$PWD\Binaries\Win64\DarkArisenOps.exe"
          & $Ops runner-check "--root=$PWD" "--engine=$env:UE55_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Ops validate "--root=$PWD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Development and Shipping
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          & "$PWD\Binaries\Win64\DarkArisenOps.exe" build "--root=$PWD" "--engine=$env:UE55_ROOT"
          exit $LASTEXITCODE

      - name: Compile and run Unreal automation tests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          & "$PWD\Binaries\Win64\DarkArisenOps.exe" build "--root=$PWD" "--engine=$env:UE55_ROOT" --automation
          exit $LASTEXITCODE

  verify-linux:
    name: Linux UE 5.5 native C++ compile, tests, laws
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ue5.5, dark-arisen]
    timeout-minutes: 120
    steps:
      - name: Check out source and LFS content
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: bash
        run: |
          "$UE55_ROOT/Engine/Build/BatchFiles/Linux/Build.sh" DarkArisenOps Linux Development "-Project=$PWD/DarkArisen.uproject" -WaitMutex -WarningsAsErrors

      - name: Validate runner and repository contract in C++
        shell: bash
        run: |
          OPS="$PWD/Binaries/Linux/DarkArisenOps"
          "$OPS" runner-check "--root=$PWD" "--engine=$UE55_ROOT"
          "$OPS" validate "--root=$PWD"

      - name: Compile Development and Shipping
        if: github.event_name == 'push'
        shell: bash
        run: |
          "$PWD/Binaries/Linux/DarkArisenOps" build "--root=$PWD" "--engine=$UE55_ROOT"

      - name: Compile and run Unreal automation tests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          "$PWD/Binaries/Linux/DarkArisenOps" build "--root=$PWD" "--engine=$UE55_ROOT" --automation
