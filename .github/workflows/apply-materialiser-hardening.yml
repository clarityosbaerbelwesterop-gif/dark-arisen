name: Apply materialiser hardening

on:
  push:
    branches: [work/alpha-content-production]
    paths: [.github/workflows/apply-materialiser-hardening.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FCu0Uvl32xCt6gAOSgi8fdfKYg/bbed2020-ca7c-4049-a4bb-1de0534b8b96.txt' -o /tmp/hardening.patch
          echo '1cca4c5167f2f2add62b6ad57eab11f91f1ece0e8171a5879a7f2a10f0674b93  /tmp/hardening.patch' | sha256sum -c -
          git apply --check /tmp/hardening.patch
          git apply /tmp/hardening.patch
          git diff --check
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('ContentSource').rglob('*.json'):
              json.loads(p.read_text())
          PY
          python3 Tools/validation/validate_alpha_runtime.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Source/DarkArisenEditor/Private/DarkArisenMaterializeAlphaCommandlet.cpp ContentSource/World/OpenSea/FirstWake_Route.json
          git commit -m 'fix(editor): fail closed on alpha materialisation contracts'
          git push origin HEAD:work/alpha-content-production
