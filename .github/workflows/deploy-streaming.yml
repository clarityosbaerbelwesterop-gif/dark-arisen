name: Deploy Native C++ Pixel Streaming

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: dark-arisen-pixel-streaming
  cancel-in-progress: false

jobs:
  deploy:
    name: Package and atomically deploy selected build
    runs-on: [self-hosted, Windows, X64, ue5.5, dark-arisen, dark-arisen-streaming]
    environment: m0-streaming
    timeout-minutes: 180
    steps:
      - name: Check out selected revision and LFS content
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: pwsh
        run: |
          & "$env:UE55_ROOT\Engine\Build\BatchFiles\Build.bat" DarkArisenOps Win64 Development "-Project=$PWD\DarkArisen.uproject" -WaitMutex -WarningsAsErrors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate before packaging
        shell: pwsh
        run: |
          $Ops = "$PWD\Binaries\Win64\DarkArisenOps.exe"
          & $Ops runner-check "--root=$PWD" "--engine=$env:UE55_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Ops validate "--root=$PWD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and atomically deploy
        shell: pwsh
        run: |
          $Commit = (git rev-parse --short=12 HEAD).Trim()
          $Revision = "$Commit-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & "$PWD\Binaries\Win64\DarkArisenOps.exe" stream-deploy "--root=$PWD" "--engine=$env:UE55_ROOT" "--revision=$Revision"
          exit $LASTEXITCODE
