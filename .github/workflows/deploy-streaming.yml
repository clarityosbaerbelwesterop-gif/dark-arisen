name: Deploy Native C++ Pixel Streaming

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: dark-arisen-pixel-streaming
  cancel-in-progress: false

jobs:
  deploy:
    name: Package and atomically deploy selected build
    runs-on: [self-hosted, Windows, X64, ue5.5, dark-arisen, dark-arisen-streaming]
    environment: m0-streaming
    timeout-minutes: 180
    steps:
      - name: Check out selected revision and LFS content
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          lfs: true

      - name: Build native C++ operations owner
        shell: cmd
        run: call "%UE55_ROOT%\Engine\Build\BatchFiles\Build.bat" DarkArisenOps Win64 Development "-Project=%GITHUB_WORKSPACE%\DarkArisen.uproject" -WaitMutex -WarningsAsErrors

      - name: Verify private Windows UE 5.5 runner
        shell: cmd
        run: "%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" runner-check "--root=%GITHUB_WORKSPACE%" "--engine=%UE55_ROOT%"

      - name: Validate M0-M8 repository contract
        shell: cmd
        run: "%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" validate "--root=%GITHUB_WORKSPACE%"

      - name: Package and atomically deploy
        shell: cmd
        run: "%GITHUB_WORKSPACE%\Binaries\Win64\DarkArisenOps.exe" stream-deploy "--root=%GITHUB_WORKSPACE%" "--engine=%UE55_ROOT%" "--revision=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
